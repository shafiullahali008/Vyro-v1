
name: VYRA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VYRA-Android-4.2.1-Build-Fix.zip
      - .github/workflows/vyra-android-build.yml

permissions:
  contents: read

concurrency:
  group: vyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VYRA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -name sdkmanager -type f 2>/dev/null | head -n 1)"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="VYRA-Android-4.2.1-Build-Fix.zip"

          test -f "$ZIP"
          unzip -t "$ZIP"

          mkdir -p "$RUNNER_TEMP/vyra-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/vyra-source"

          test -f "$RUNNER_TEMP/vyra-source/VYRA/settings.gradle"
          test -f "$RUNNER_TEMP/vyra-source/VYRA/app/build.gradle"

      - name: Build debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/vyra-source/VYRA"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          gradle --no-daemon --stacktrace \
            --warning-mode all assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/vyra-source/VYRA"

          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload VYRA APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Android-APK
          path: ${{ runner.temp }}/vyra-source/VYRA/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## VYRA Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK build: ${{ steps.apk.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          
