name: VYRA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VYRA-Android-4.2.1-Build-Fix.zip
      - .github/workflows/vyra-android-build.yml

permissions:
  contents: read

concurrency:
  group: vyra-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VYRA debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK manager not found: $SDKMANAGER" >&2
            find /usr/local/lib/android/sdk -name sdkmanager -type f || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f VYRA-Android-4.2.1-Build-Fix.zip
          unzip -t VYRA-Android-4.2.1-Build-Fix.zip
          mkdir -p "$RUNNER_TEMP/vyra-source"
          unzip -q VYRA-Android-4.2.1-Build-Fix.zip \
            -d "$RUNNER_TEMP/vyra-source"
          test -f "$RUNNER_TEMP/vyra-source/VYRA/settings.gradle"
          test -f "$RUNNER_TEMP/vyra-source/VYRA/app/build.gradle"

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vyra-source/VYRA"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace --warning-mode all \
            testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Android-APK
          path: ${{ runner.temp }}/vyra-source/VYRA/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
